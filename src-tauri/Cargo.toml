[package]
name = "dealer-integration"
version = "0.1.0"
description = "经销商线索×广告投放整合桌面客户端"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dealer_integration_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "0.30.1"
chrono = { version = "0.4.45", features = ["serde"] }
keyring = { version = "3.6.3", features = ["windows-native", "apple-native"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_xlsxwriter = "0.92.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "time", "sync", "rt"] }
