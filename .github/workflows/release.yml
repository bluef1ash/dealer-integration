# 多平台打包：PR 到 main 做出包验证；推 v* tag 出正式安装包并建草稿 Release。
# tag 触发时版本号自动同步为 tag（scripts/sync-version.mjs），产物版本与 Release 一致。
name: 多平台打包

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

# 同一分支新推送取消旧构建；tag 构建不取消（Release 出包不能被打断）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
            rust_targets: ''
          # universal 二进制同时覆盖 Apple Silicon 与 Intel Mac（CI 无老 Mac 机型可单独出 x86_64 包）
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-24.04
            target: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Rust（stable + 目标三元组）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux 系统依赖（webkit2gtk 等）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 版本号同步为 tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/sync-version.mjs "${GITHUB_REF_NAME#v}"

      - name: 构建（tag 时附带创建草稿 Release）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          # 非 tag 触发时 tagName 为空串，tauri-action 只出包不建 Release
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('经销商整合 {0}', github.ref_name) || '' }}
          releaseBody: '安装包见下方 Assets。macOS 为 universal 包（Apple Silicon / Intel 通用），首次打开如被 Gatekeeper 拦截：右键 App → 打开。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: 上传构建产物（非 tag 运行，供 PR 验证直接下载）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.appimage
            src-tauri/target/**/bundle/**/*.deb
